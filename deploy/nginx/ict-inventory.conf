# ICT Equipment & Borrowing Management System — nginx (Ubuntu 24.04)
#
# One server block serves both projects from one hostname:
#   /        -> the Vue SPA (static files from web/dist)
#   /api/    -> the Laravel API (PHP-FPM)
#
# Sharing an origin is deliberate. It keeps the deployment to a single
# certificate and hostname, and it removes CORS from the picture entirely
# (FRONTEND_URLS still needs the origin, for anyone hitting the API directly).
#
# Install:
#   sudo cp ict-inventory.conf /etc/nginx/sites-available/ict-inventory
#   sudo ln -s /etc/nginx/sites-available/ict-inventory /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name inventory.example.gov.ph;   # <-- change

    # Certbot writes its challenge here; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inventory.example.gov.ph;   # <-- change

    ssl_certificate     /etc/letsencrypt/live/inventory.example.gov.ph/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inventory.example.gov.ph/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # HTTPS is not optional here: the QR scanner uses getUserMedia(), which
    # browsers only expose in a secure context. On plain HTTP the camera silently
    # never starts and the app falls back to typing codes by hand.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    charset utf-8;
    client_max_body_size 12M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ------------------------------------------------------------------ API
    root /var/www/ict-inventory/api/public;
    index index.php;

    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # ------------------------------------------------------------------ SPA
    location / {
        root /var/www/ict-inventory/web/dist;

        # vue-router uses history mode, so any unknown path must return
        # index.html and let the client router resolve it — otherwise a browser
        # refresh on /equipment 404s.
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints these filenames, so they can be cached indefinitely.
    location /assets/ {
        root /var/www/ict-inventory/web/dist;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or clients keep loading a stale bundle
    # that points at deleted asset filenames after a deploy.
    location = /index.html {
        root /var/www/ict-inventory/web/dist;
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Nothing outside public/ is reachable, but be explicit about the obvious.
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/ict-inventory.access.log;
    error_log  /var/log/nginx/ict-inventory.error.log;
}
